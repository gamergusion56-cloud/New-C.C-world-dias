<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusTopUp | MLBB Instant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>

    <nav>
        <div class="logo">NEXUS<span>⚡</span></div>
        <div class="nav-links">
            <a href="#">Support</a>
            <button class="btn-sm">Track</button>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h1 class="glitch" data-text="INSTANT DIAMONDS">INSTANT DIAMONDS</h1>
            <p>Authorized MLBB Partner • No Password Required</p>
        </section>

        <section class="booking-zone">
            <div class="glass-card">
                <div class="step-num">01</div>
                <h2>Enter Game ID</h2>
                <div class="id-flex">
                    <input type="number" id="uid" placeholder="User ID">
                    <input type="number" id="zid" placeholder="Zone">
                </div>
                <button onclick="verifyUser()" id="verifyBtn" class="main-btn">Verify Account</button>
                <p id="userNameDisplay" class="success-text"></p>
            </div>

            <div class="product-selection">
                <div class="section-title">
                    <div class="step-num">02</div>
                    <h2>Select Package</h2>
                </div>
                
                <div class="grid">
                    <div class="pack hot-pack">
                        <div class="save-tag">TOP SELLER</div>
                        <span class="diamond-icon">💎</span>
                        <div class="pack-info">
                            <h3>Weekly Pass</h3>
                            <p>210 Diamonds</p>
                        </div>
                        <div class="price">₹160.00</div>
                    </div>

                    <div class="pack">
                        <span class="diamond-icon">💎</span>
                        <div class="pack-info">
                            <h3>86 Diamonds</h3>
                            <p>Direct Top-Up</p>
                        </div>
                        <div class="price">₹85.00</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
